name: AgentHelm
options:
  bundleIdPrefix: dev.dhravesh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.6"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # Hardened runtime intentionally off for pre-release ad-hoc builds.
    # Re-enable in v1.0 when distributing signed/notarized DMGs.
    ENABLE_HARDENED_RUNTIME: NO

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1

targets:
  AgentHelm:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentHelm
    dependencies:
      - package: Citadel
    info:
      path: Sources/AgentHelm/Info.plist
      properties:
        CFBundleName: Agent Helm
        CFBundleDisplayName: Agent Helm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Dhravesh Shah. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhravesh.AgentHelm
        CODE_SIGN_ENTITLEMENTS: Sources/AgentHelm/AgentHelm.entitlements
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO

  AgentHelmTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AgentHelmTests
    dependencies:
      - target: AgentHelm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhravesh.AgentHelmTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AgentHelm:
    build:
      targets:
        AgentHelm: all
        AgentHelmTests: [test]
    test:
      targets:
        - AgentHelmTests
