name: Rookery
options:
  bundleIdPrefix: dev.dhravesh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "50"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # Hardened runtime intentionally off for pre-release ad-hoc builds.
    # Re-enable in v1.0 when distributing signed/notarized DMGs.
    ENABLE_HARDENED_RUNTIME: NO

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.10.0

targets:
  Rookery:
    type: application
    platform: macOS
    sources:
      - path: Sources/Rookery
    dependencies:
      - package: Citadel
      - package: MarkdownUI
        product: MarkdownUI
      - package: GRDB
        product: GRDB
    info:
      path: Sources/Rookery/Info.plist
      properties:
        CFBundleName: Rookery
        CFBundleDisplayName: Rookery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Dhravesh Shah. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhravesh.Rookery
        CODE_SIGN_ENTITLEMENTS: Sources/Rookery/Rookery.entitlements
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO

  RookeryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RookeryTests
    dependencies:
      - target: Rookery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhravesh.RookeryTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rookery:
    build:
      targets:
        Rookery: all
        RookeryTests: [test]
    test:
      targets:
        - RookeryTests
